spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:h2:file:~/paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ecommerce}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false

server:
  port: 8085

payment:
  google-pay:
    merchant-vpa: ${GOOGLE_PAY_MERCHANT_VPA:merchant@upi}
    merchant-name: ${GOOGLE_PAY_MERCHANT_NAME:Karan Test Score}
    merchant-code: ${GOOGLE_PAY_MERCHANT_CODE:0000}
  local-mode: ${PAYMENT_LOCAL_MODE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
