services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev --hostname=keycloak --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - ecommerce-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data
      
    networks:
      - ecommerce-network

  user-service:
    build: ./user_service
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
    volumes:
      - user_data:/data
    networks:
      - ecommerce-network

  product-service:
    build: ./product_service
    container_name: product-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
    volumes:
      - product_data:/data
    networks:
      - ecommerce-network

  order-service:
    build: ./order_service
    container_name: order-service
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
      - kafka
      - user-service
      - product-service
    volumes:
      - order_data:/data
    networks:
      - ecommerce-network

  inventory-service:
    build: ./inventory_service
    container_name: inventory-service
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
      - kafka
    volumes:
      - inventory_data:/data
    networks:
      - ecommerce-network

  payment-service:
    build: ./payment_service
    container_name: payment-service
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - keycloak
      - kafka
      - order-service
    volumes:
      - payment_data:/data
    networks:
      - ecommerce-network

  shipping-service:
    build:
      context: ./shipping_service
      dockerfile: Dockerfile

    container_name: shipping-service

    ports:
      - "8086:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      SHIPPING_EVENTS_ENABLED: "true"

    depends_on:
      - kafka
      - keycloak

    volumes:
      - shipping-data:/data

    networks:
      - ecommerce-network

    restart: unless-stopped

networks:
  ecommerce-network:

volumes:
  keycloak_data:
  kafka_data:
  user_data:
  product_data:
  order_data:
  inventory_data:
  payment_data:
  shipping-data:
  